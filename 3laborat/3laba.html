<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Крестики-нолики</title>
  <link rel="stylesheet" href="3style.css">
</head>
<body>

<header>
  <h1>Крестики-нолики</h1>
  <p>Кажется, здесь стоит добавить историю появления игры. </p>
</header>

<main>

  <section class="card center">
    <h2>Настройки игры</h2>

    <label>Размер поля:</label>
    <input type="number" id="size" min="3" value="3">
    <button onclick="startGame()">Начать игру</button>
    <button onclick="restartGame()">Перезапуск</button>
  </section>

  <section class="card center">
    <h2>Игровое поле</h2>
    <div id="game"></div>
  </section>

</main>

<footer>
  © создано при поддержке крыс
</footer>

<script src="3script.js"></script>
</body>
</html>
