<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>ToDo List</title>
  <link rel="stylesheet" href="4style.css">
</head>
<body>

<header>
  <h1>ToDo List</h1>
</header>

<main>
  <div class="card">
    <h2>Добавить задачу</h2>
    
    <input id="title" placeholder="Название задачи">
    <textarea id="description" placeholder="Описание (необязательно)"></textarea>
    
    <button onclick="addTask()">Добавить</button>
  </div>

  <div class="card">
    <h2>Список задач</h2>
    <ul id="taskList"></ul>
  </div>
</main>

<script src="4script.js"></script>
</body>
</html>
